name: Vince AlwaysStrong OAEP MGF1 SHA1 trial

on:
  push:
    branches:
      - test/alwaysstrong-oaep-vince
    paths:
      - 'tools/alwaysstrong-oaep/**'
      - '.github/workflows/alwaysstrong-oaep-vince.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-oaep-trial:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Vince patch harness
        uses: actions/checkout@v4

      - name: Setup JDK 21 for upstream Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK on GitHub runner
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Checkout pinned TEESimulator-RS (official upstream)
        run: |
          git clone --depth 1 --branch v6.0.1-307 --recurse-submodules https://github.com/Enginex0/TEESimulator-RS.git tee-src
          git -C tee-src rev-parse HEAD
          test -e tee-src/app/src/main/java/org/matrix/TEESimulator/interception/keystore/shim/SoftwareOperation.kt

      - name: Patch only missing MGF1 digest fallback
        run: |
          python3 tools/alwaysstrong-oaep/patch_engine.py tee-src
          git -C tee-src diff --check
          git -C tee-src diff -- app/src/main/java/org/matrix/TEESimulator/interception/keystore/shim/SoftwareOperation.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tee-src/app/src/main/java/org/matrix/TEESimulator/interception/keystore/shim/SoftwareOperation.kt')
          s=p.read_text()
          assert '                    } ?: "SHA-1"' in s
          assert '                    } ?: mainDigest' not in s
          print('PASS: source regression check for MGF1 SHA-1 default')
          PY

      - name: Compile patched TEESimulator-RS release ZIP
        working-directory: tee-src
        run: |
          chmod +x ./gradlew
          # The upstream wrapper hardcodes 10 seconds; GitHub network download can exceed it.
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          # The official large download returns HTTP 504 on this runner.
          # Read the SHA-256 from official Gradle first, then pin it in wrapper.
          expected="$(curl -fsSL --retry 3 --retry-delay 3 https://services.gradle.org/distributions/gradle-9.2.0-bin.zip.sha256 | tr -d '[:space:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid official checksum' >&2; exit 1; }
          echo "distributionSha256Sum=$expected" >> gradle/wrapper/gradle-wrapper.properties
          # Verified alternative mirror for Gradle distribution bytes only.
          sed -i 's#services.gradle.org/distributions#mirrors.aliyun.com/github/releases/gradle/gradle-distributions/v9.2.0#' gradle/wrapper/gradle-wrapper.properties
          # Maven Central / JetBrains release CDN occasionally returns 504.
          # Retry dependency-resolution failures; fail if compilation still fails.
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew zipRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx3072m; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "ERROR: Gradle failed three consecutive attempts" >&2
              exit 1
            fi
            sleep 12
          done
          test -n "$(find out -maxdepth 1 -name 'TEESimulator-RS-*-Release.zip' -print -quit)"
          unzip -t out/TEESimulator-RS-*-Release.zip | tail -2
          sha256sum out/TEESimulator-RS-*-Release.zip

      - name: Archive successfully compiled corrected engine
        run: |
          set -euo pipefail
          mkdir -p engine-artifact
          engine="$(find tee-src/out -maxdepth 1 -name 'TEESimulator-RS-*-Release.zip' -print -quit)"
          test -f "$engine"
          unzip -t "$engine" | tail -2
          cp "$engine" engine-artifact/
          (cd engine-artifact && sha256sum *.zip > SHA256SUMS.txt)
          printf '%s\n' 'ENGINE ONLY: DO NOT INSTALL BESIDE ALWAYSSTRONG. It must be integrated into your original official AlwaysStrong [Inject] v1.0.5 ZIP. NO KERNEL HERE. This is an untested experiment.' > engine-artifact/NOT_AN_INSTALLER.txt

      - name: Upload patched engine only (not user-installable)
        uses: actions/upload-artifact@v4
        with:
          name: VINCE-OAEP-SHA1-PATCHED-ENGINE-ONLY
          path: engine-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Check availability of official AlwaysStrong v1.0.5 source
        id: official
        run: |
          if git clone --depth 1 --branch v1.0.5 https://github.com/evoker0/AlwaysStrong.git alwaysstrong; then
            test -f alwaysstrong/module-variants/inject/build.conf
            grep -q -- '--tee-file' alwaysstrong/build.sh
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Official AlwaysStrong v1.0.5 source is unavailable; only verified engine artifact will be uploaded. DO NOT install engine as a second module.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build patched AlwaysStrong Inject trial
        if: steps.official.outputs.available == 'true'
        run: |
          set -euo pipefail
          tee_zip="$(find "$GITHUB_WORKSPACE/tee-src/out" -maxdepth 1 -name 'TEESimulator-RS-*-Release.zip' -print -quit)"
          test -f "$tee_zip"
          cd alwaysstrong
          bash ./build.sh --variant inject --tee-file "$tee_zip"
          find out -maxdepth 1 -type f -name '*inject*.zip' -print
          built="$(find out -maxdepth 1 -type f -name '*inject*.zip' -print -quit)"
          test -n "$built"
          mkdir -p "$GITHUB_WORKSPACE/trial"
          cp "$built" "$GITHUB_WORKSPACE/trial/Vince-AlwaysStrong-v1.0.5-Inject-OAEPFIX-TRIAL.zip"

      - name: Verify ZIP format and mandatory assets
        if: steps.official.outputs.available == 'true'
        run: |
          set -euo pipefail
          trial='trial/Vince-AlwaysStrong-v1.0.5-Inject-OAEPFIX-TRIAL.zip'
          unzip -t "$trial" | tail -2
          unzip -Z1 "$trial" | grep -qx 'tee_classes.dex'
          unzip -Z1 "$trial" | grep -qx 'module.prop'
          unzip -Z1 "$trial" | grep -q '^lib/arm64-v8a/.*[.]so$'
          unzip -p "$trial" module.prop | grep -q '^id=tricky_store'
          sha256sum "$trial" | tee trial/SHA256SUMS.txt
          printf '%s\n' 'SOURCE PATCH BUILT; NOT TESTED ON REDMI 5 PLUS. NO KERNEL INCLUDED.' > trial/READ_BEFORE_INSTALL.txt
          unzip -Z1 "$trial" | grep -E '(boot[.]img|Image|dtb|kernel)' && {
            echo 'ERROR: unexpected kernel image in module artifact'; exit 1;
          } || true

      - name: Upload trial artifact (no automatic device install)
        if: steps.official.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vince-AlwaysStrong-v1_0_5-Inject-OAEPFIX-TRIAL
          path: trial/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
