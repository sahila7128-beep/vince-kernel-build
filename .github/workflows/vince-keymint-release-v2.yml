name: Publish Vince KeyMint Diagnostic APK
on:
  push:
    branches: [diag-keymint-oaep-v2]
    paths: [.github/workflows/vince-keymint-release-v2.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified successful diagnostic artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 42413129931 --repo "$GITHUB_REPOSITORY" --name Vince-KeyMint-OAEP-Diagnostic-v2 --dir release
          test -s release/Vince-KeyMint-OAEP-Diagnostic-v2.apk
          echo "42cc8e2dd54157f0051737bca304f8d06c32bf0d36ad3a9f25679b3a1ea5ddbd  release/Vince-KeyMint-OAEP-Diagnostic-v2.apk" | sha256sum -c -
      - name: Publish direct download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="vince-keymint-diagnostic-v2.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Vince-KeyMint-OAEP-Diagnostic-v2.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/Vince-KeyMint-OAEP-Diagnostic-v2.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vince KeyMint RSA-OAEP Diagnostic v2.0" --notes "Standalone offline diagnostic app. No root or INTERNET permission. Uses ephemeral test keys; checks SHA-256 OAEP with MGF1 SHA-1 and SHA-256. SHA256 APK: 42cc8e2dd54157f0051737bca304f8d06c32bf0d36ad3a9f25679b3a1ea5ddbd. Diagnostic only; not a kernel or fix." --prerelease --latest=false
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
